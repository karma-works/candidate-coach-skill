    <rect x="938" y="434" width="154" height="27" rx="13.5" fill="#1FBE91" fill-opacity="0.17"/>
    <circle cx="957" cy="447.5" r="4" fill="#4BE1B1"/>
    <text x="970" y="452" fill="#62E7BD" font-size="11" font-weight="750">VERIFIED LIVE</text>
    <text x="938" y="481" fill="#D6DCF0" font-size="12">Slight stretch · 88% fit</text>

    <rect x="390" y="518" width="730" height="88" rx="16" fill="#FFFFFF" fill-opacity="0.075" stroke="#FFFFFF" stroke-opacity="0.1"/>
