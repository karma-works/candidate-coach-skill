<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Candidate Coach simulated conversation</title>
  <desc id="desc">An illustrative chat in which Candidate Coach verifies and ranks three roles against a configured career profile.</desc>
  <defs>
    <linearGradient id="frame" x1="80" y1="20" x2="1120" y2="740" gradientUnits="userSpaceOnUse">
