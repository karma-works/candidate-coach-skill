    <text x="428" y="560" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">3</text>
    <text x="464" y="546" fill="#F7F8FF" font-size="16" font-weight="700">Director, Applied AI</text>
    <text x="464" y="573" fill="#9EA9C8" font-size="13">Alpine Cloud · Remote in Switzerland</text>
    <rect x="938" y="536" width="154" height="27" rx="13.5" fill="#1FBE91" fill-opacity="0.17"/>
    <circle cx="957" cy="549.5" r="4" fill="#4BE1B1"/>
    <text x="970" y="554" fill="#62E7BD" font-size="11" font-weight="750">VERIFIED LIVE</text>
    <text x="938" y="583" fill="#D6DCF0" font-size="12">Strong evidence · 84% fit</text>

